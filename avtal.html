<body>
<div id="loading" style="font-family:Arial,sans-serif;padding:40px;text-align:center;color:#555">Laddar dokument…</div>
<div id="error" style="display:none;font-family:Arial,sans-serif;padding:40px;text-align:center;color:#dc2626;font-size:16px">
  <strong>Länk ej giltig.</strong><br>Kontakta FlexyFinder AB om du har fått denna länk via e-post.
</div>
<div id="doc" style="display:none"></div>

<script>
/* ══════════════════════════════════════════════════════════
   ⚙️  KONFIG – fyll i dina Supabase-uppgifter innan uppladdning
   ══════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://ugxiqwhplgdgrbynihrq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4wkTf4W9kjRht383JJbJJA_9V5ei9k8';

const params  = new URLSearchParams(location.search);
const TOKEN   = params.get('t');
const NR      = params.get('nr');

/* Avgör avtalspart från URL-parameter (standard: uthyrare) */
const MOTTAGARE = params.get('m') || 'uthyrare';

function show(id) {
  ['loading','error','doc'].forEach(x => document.getElementById(x).style.display = x===id ? '' : 'none');
}

async function load() {
  if (!TOKEN) { show('error'); return; }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data: a, error } = await sb.from('avtal').select('*').eq('share_token', TOKEN).single();
  if (error || !a) { show('error'); return; }
  document.title = `${NR||''} Avtal – FlexyFinder`;
  document.getElementById('doc').innerHTML = renderAvtal(a, MOTTAGARE);
  show('doc');
}

function renderAvtal(a, mottagare) {
  const ffPct   = parseFloat(a.ff_avgift_procent) || 8.5;
  const timmar  = parseFloat(a.timmar_totalt) || 0;
  const tpris   = parseFloat(a.timpris) || 0;
  const nPers   = parseInt(a.antal_personer) || 1;
  const uppdr   = nPers * timmar * tpris;
  const avgRaw  = uppdr * (ffPct / 100);
  const avgift  = uppdr > 0 ? Math.max(Math.round(avgRaw), 995) : 0;
  const tillUth = Math.round(uppdr - avgift);
  const kundMoms= Math.round(uppdr * 0.25);
  const ffMoms  = Math.round(avgift * 0.25);
  const today   = new Date().toLocaleDateString('sv-SE');
  const avnr    = a.match_id || (a.avtal_nummer ? 'FF-' + new Date().getFullYear() + '-' + String(a.avtal_nummer).padStart(4,'0') : '–');
  const avKundNamn = (mottagare === 'kund' ? (a.inhyrare_foretag || a.foretag) : a.uthyrare_foretag) || '';
  const f  = v  => v || '–';
  const fkr= v  => v > 0 ? Math.round(v).toLocaleString('sv-SE') + ' kr' : '–';

  return `
<style>

.party-label{font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#555;margin-bottom:6px;border-bottom:1px solid #ccc;padding-bottom:4px}
.party-name{font-size:11pt;font-weight:700;margin-bottom:4px}
.party-row{font-size:9pt;color:#333;margin-bottom:2px}

table.spec th{background:#1a1a1a;color:#fff;padding:7px 10px;text-align:left;font-size:9pt;text-transform:uppercase;letter-spacing:0.5px}

table.spec tr:nth-child(even) td{background:#f8f8f8}

.print-btn{display:inline-block;background:#1a1a1a;color:#fff;border:none;padding:10px 24px;font-size:12px;font-family:Arial,sans-serif;cursor:pointer;border-radius:4px;margin-right:8px}

</style>

<h1>Uppdragsavtal</h1>
<div class="sub-title">Uppdragsavtal</div>
<div class="header-meta">
  <span><strong>Version:</strong> 1.0</span>
  <span><strong>Datum:</strong> ${today}</span>
  <span><strong>Avtalsnummer:</strong> ${avnr}</span>
</div>

<div class="section-num">1. Avtalsparter</div>
<div class="parties">
  <div class="party-box">
    <div class="party-label">Leverantören (Uthyrning)</div>
    <div class="party-name">${f(a.uthyrare_foretag)}</div>
    ${a.uthyrare_org_nr?`<div class="party-row">Org.nr: ${a.uthyrare_org_nr}</div>`:''}
    ${a.uthyrare_fakturaadress?`<div class="party-row">Adress: ${a.uthyrare_fakturaadress}</div>`:''}
    ${(a.uthyrare_postnr||a.uthyrare_ort)?`<div class="party-row">${[a.uthyrare_postnr,a.uthyrare_ort].filter(Boolean).join(' ')}</div>`:''}
    ${a.uthyrare_kontakt?`<div class="party-row">Kontakt: ${a.uthyrare_kontakt}</div>`:''}
    ${a.uthyrare_epost?`<div class="party-row">E-post: ${a.uthyrare_epost}</div>`:''}
    ${a.uthyrare_faktura_epost?`<div class="party-row">Faktura e-post: ${a.uthyrare_faktura_epost}</div>`:''}
  </div>
  <div class="party-box">
    <div class="party-label">Kunden (Inhyrning)</div>
    <div class="party-name">${f(a.inhyrare_foretag)}</div>
    ${a.inhyrare_org_nr?`<div class="party-row">Org.nr: ${a.inhyrare_org_nr}</div>`:''}
    ${a.inhyrare_kontakt?`<div class="party-row">Kontakt: ${a.inhyrare_kontakt}</div>`:''}
    ${a.inhyrare_epost?`<div class="party-row">E-post: ${a.inhyrare_epost}</div>`:''}
    ${a.inhyrare_telefon?`<div class="party-row">Telefon: ${a.inhyrare_telefon}</div>`:''}
  </div>
</div>

<div class="section-num">2. Avtalstid</div>
<p>Uppdraget löper från <strong>${f(a.period_start)}</strong> till och med <strong>${f(a.period_end)}</strong>.
${a.arbetstid?'Arbetstid: '+a.arbetstid+'.':''}</p>

<div class="section-num">3. Personal</div>
<div class="section-sub">3.1 Yrkesroll och kompetens</div>
<p>Leverantören ska tillhandahålla personal med yrkesrollen <strong>${f(a.yrkesroll)}</strong>${a.resurs?' ('+a.resurs+')':''} för utförande av uppdraget. Leverantören ansvarar för att personalen innehar rätt kompetens, certifieringar och behörigheter för uppgiften.</p>
<div class="section-sub">3.2 Lön och ersättning</div>
<p>Leverantören är formell arbetsgivare och ansvarar för lön, arbetsgivaravgifter, semesterersättning samt övriga arbetsgivarförpliktelser gentemot den uthyrda personalen. Kunden har inget arbetsgivaransvar.</p>
<div class="section-sub">3.3 Arbetstid och schemaläggning</div>
<p>Kunden ansvarar för planering och schemaläggning av den uthyrda personalens arbetstid inom ramen för uppdraget. Eventuell övertid ska godkännas av Leverantören i förväg.</p>
<div class="section-sub">3.4 Kompetenskrav och ansvar</div>
<p>Vid byte av personal under avtalstiden ska Leverantören informera Kunden i god tid och tillhandahålla personal med likvärdig kompetens. Byte ska godkännas av Kunden om byte påverkar uppdragets genomförande.</p>
<div class="section-sub">3.5 Semester och frånvaro</div>
<p>Planerad semester och frånvaro ska meddelas Kunden minst två veckor i förväg. Leverantören ansvarar för att säkerställa täckning vid frånvaro om inte annat överenskommes.</p>
<div class="section-sub">3.6 Tystnadsplikt</div>
<p>Den uthyrda personalen är bunden av samma sekretessförpliktelser som gäller för uppdraget. Leverantören ansvarar för att personalen är informerad om och efterlever Kundens sekretessregler.</p>

<div class="section-num">4. Ekonomisk reglering</div>
<div class="section-sub">4.1 Fakturamodell och betalning</div>
<p>Fakturering sker ${f(a.faktureringsmodell||'månadsvis i efterskott')} baserat på utförda och av Kunden godkända arbetstimmar. Timpris uppgår till <strong>${fkr(tpris)}/timme</strong> exklusive moms.</p>
<div class="section-sub">4.2 Betalningsvillkor</div>
<p>Betalning ska erläggas inom <strong>30 dagar</strong> från fakturadatum.</p>
<div class="section-sub">4.3 Dröjsmålsränta</div>
<p>Vid försenad betalning utgår dröjsmålsränta enligt räntelagen, motsvarande referensräntan plus <strong>8 procentenheter</strong>.</p>
<div class="section-sub">4.4 Prisändring</div>
<p>Överenskommet timpris är fast under avtalstiden. Justering för förlängningsperiod ska avtalas skriftligen minst 30 dagar innan ny period inleds.</p>
<div class="section-sub">4.5 Ansvarsbegränsning</div>
<p>Parts totala skadeståndsansvar är begränsat till <strong>50 prisbasbelopp</strong> per skadehändelse, om inte skadan orsakats genom grov vårdslöshet eller uppsåt.</p>

<div class="section-num">5. Allmänna bestämmelser</div>
<div class="section-sub">5.1 Avtalstolkning</div>
<p>Vid tolkning av detta avtal ska parternas gemensamma avsikt ha företräde. Bilaga 1 utgör en integrerad del av avtalet.</p>
<div class="section-sub">5.2 Ändringar och tillägg</div>
<p>Ändringar ska ske skriftligen och undertecknas av behöriga företrädare för båda parter.</p>
<div class="section-sub">5.3 Överlåtelse</div>
<p>Part får inte utan den andra partens skriftliga godkännande överlåta rättigheter eller skyldigheter enligt detta avtal.</p>
<div class="section-sub">5.4 Force majeure</div>
<p>Part är befriad från påföljd vid omständigheter utanför parts kontroll som parten inte skäligen kunde förväntas ha räknat med.</p>
<div class="section-sub">5.5 Konkurrensklausul</div>
<p>Kunden förbinder sig att inte ingå anställningsavtal med den uthyrda personalen direkt under avtalstiden samt under <strong>12 månader</strong> efter avslut. Vid brott utgår avtalsvite om <strong>3 månaders bruttolön</strong>.</p>
<div class="section-sub">5.6 Personuppgifter (GDPR)</div>
<p>Parterna behandlar personuppgifter i enlighet med GDPR och vidtar lämpliga säkerhetsåtgärder.</p>
<div class="section-sub">5.7 Sekretess</div>
<p>Parterna behandlar all information som konfidentiell under avtalstiden och <strong>3 år</strong> därefter.</p>
<div class="section-sub">5.8 Tvistelösning</div>
<p>Tvist avgörs av <strong>Stockholms tingsrätt</strong> med tillämpning av svensk rätt.</p>
<div class="section-sub">5.9 Ikraftträdande</div>
<p>Avtalet träder i kraft när båda parter godkänt uppdraget i Flexyfinder-plattformen.</p>

<div class="bilaga-header">Bilaga 1 – Uppdragsspecifikation</div>
<div class="bilaga-sub">Upprättad av Flexyfinder utifrån den bekräftade matchningen &nbsp;·&nbsp; Avtalsnummer: ${avnr}</div>
<table class="spec">
  <thead><tr><th colspan="2">Parter</th></tr></thead>
  <tbody>
    <tr><td class="label">Leverantör (uthyrare)</td><td class="val">${f(a.uthyrare_foretag)}${a.uthyrare_org_nr?' — Org.nr: '+a.uthyrare_org_nr:''}</td></tr>
    <tr><td class="label">Kund (inhyrare)</td><td class="val">${f(a.inhyrare_foretag)}${a.inhyrare_org_nr?' — Org.nr: '+a.inhyrare_org_nr:''}</td></tr>
  </tbody>
</table>
<table class="spec">
  <thead><tr><th colspan="2">Uppdraget</th></tr></thead>
  <tbody>
    <tr><td class="label">Yrkesroll / Kompetens</td><td class="val">${f(a.yrkesroll)}</td></tr>
    <tr><td class="label">Resurs (namn)</td><td class="val">${f(a.resurs)}</td></tr>
    <tr><td class="label">Antal personer</td><td class="val">${nPers}</td></tr>
    <tr><td class="label">Arbetsplats</td><td class="val">${f(a.arbetsplats)}</td></tr>

</table>
<table class="spec">

    <tr><td class="label">Startdatum</td><td class="val">${f(a.period_start)}</td></tr>

    <tr><td class="label">Arbetstid</td><td class="val">${f(a.arbetstid)}</td></tr>
    <tr><td class="label">Beräknade timmar totalt</td><td class="val">${timmar > 0 ? timmar + ' h' : '–'}</td></tr>
  </tbody>
</table>
${mottagare === 'kund' ? `
<table class="spec">
  <thead><tr><th colspan="2">Ekonomi</th></tr></thead>
  <tbody>
    <tr><td class="label">Timpris exkl. moms</td><td class="val">${fkr(tpris)}/h</td></tr>
    <tr><td class="label">Faktureringsmodell</td><td class="val">${f(a.faktureringsmodell)}</td></tr>
    <tr><td class="label">Uppdragsbelopp exkl. moms</td><td class="val">${fkr(uppdr)}</td></tr>
    <tr><td class="label">Moms 25%</td><td class="val">${fkr(kundMoms)}</td></tr>
    <tr><td class="label" style="font-weight:700">Totalt inkl. moms</td><td class="val" style="font-weight:700">${fkr(uppdr+kundMoms)}</td></tr>
  </tbody>
</table>` : `
<table class="spec">
  <thead><tr><th colspan="2">Ekonomi</th></tr></thead>
  <tbody>
    <tr><td class="label">Timpris (fakturerat av leverantören)</td><td class="val">${fkr(tpris)}/h</td></tr>
    <tr><td class="label">Faktureringsmodell</td><td class="val">${f(a.faktureringsmodell)}</td></tr>
    <tr><td class="label">Uppdragsbelopp exkl. moms</td><td class="val">${fkr(uppdr)}</td></tr>
    <tr><td class="label">Flexyfinder-avgift (${ffPct}%) exkl. moms</td><td class="val">${fkr(avgift)}</td></tr>
    <tr><td class="label">Moms 25% på FF-avgift</td><td class="val">${fkr(ffMoms)}</td></tr>
    <tr><td class="label">FF-avgift inkl. moms</td><td class="val">${fkr(avgift+ffMoms)}</td></tr>
    <tr><td class="label" style="font-weight:700">Till leverantören exkl. moms</td><td class="val" style="font-weight:700">${fkr(tillUth)}</td></tr>
  </tbody>
</table>`}
<p style="font-size:8.5pt;color:#666;margin-top:16px;font-family:Arial,sans-serif">
  ${mottagare === 'kund'
    ? 'Leverantören fakturerar Kunden enligt ovan angivna belopp. Denna bilaga är en integrerad del av Uppdragsavtalet.'
    : 'Leverantören fakturerar Kunden för hela uppdragsbeloppet. Flexyfinder-avgiften dras av och resterande belopp tillfaller Leverantören. Denna bilaga är en integrerad del av Uppdragsavtalet.'}
</p>`;
}

load();
</script>
