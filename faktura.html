const params = new URLSearchParams(location.search);
const TOKEN  = params.get('t');
const NR     = params.get('nr');

function show(id) {
  ['loading','error','doc'].forEach(x => document.getElementById(x).style.display = x===id ? '' : 'none');
}

async function load() {
  if (!TOKEN) { show('error'); return; }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Hämta faktura via token
  const { data: f, error: e1 } = await sb.from('fakturor').select('*').eq('share_token', TOKEN).single();
  if (e1 || !f) { show('error'); return; }
  // Logga öppnat (fire and forget)
  sb.from('fakturor').update({ opened_at: new Date().toISOString() }).eq('share_token', TOKEN);

  // Hämta kopplat avtal
  let a = {};
  if (f.avtal_id) {
    const { data: av } = await sb.from('avtal').select('*').eq('id', f.avtal_id).single();
    if (av) a = av;
  }

  document.title = `${NR||''} Faktura – FlexyFinder`;
  document.getElementById('doc').innerHTML = renderFaktura(f, a);
  show('doc');
}
